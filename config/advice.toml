# 省额度建议（消耗诊断）的阈值与外部链接。
# 阈值依据 2026-10 在真实日志上的测量，用户可用覆盖文件调整。
version = "2026-10-27"

[severity]
# 可避免部分达到这么多周额度百分点，标为“多耗”（Error），否则为“提醒”（Warning）
error_weekly_pct = 3.0
# 没有额度数据时，按可避免的 API 等价费用判断
error_cost_usd = 5.0

[cache_rebuild]
# 本次重新写入缓存（Codex 为未缓存输入）超过这么多 token 才算整段重建
min_rebuild_tokens = 20000
# 缓存读取占（读取 + 重建）的比例低于这个值，才认为缓存已失效
max_read_share = 0.3
# Claude 缓存时长：用了 1 小时缓存写入时按 60 分钟，否则按 5 分钟
claude_ttl_5m_minutes = 5
claude_ttl_1h_minutes = 60
# Codex 未公开缓存时长，按这个间隔判断
codex_ttl_minutes = 30

[long_context]
# 单次请求上下文（输入 + 缓存读 + 缓存写）超过这个值才提示；1M 上下文下 20 万以上很常见
threshold_tokens = 300000
# 估算可节省部分时，假设及时压缩到这个长度
target_tokens = 150000

[light_task]
# 一次提示下的请求数不超过这个值、总输出少于这个 token 数，视为轻量任务
max_requests = 3
max_output_tokens = 800
# 名称包含这些片段的模型视为高价模型
claude_expensive = ["opus", "fable"]
codex_expensive = ["gpt-6-astra"]
# 估算节省时改用的模型
claude_alternative = "claude-sonnet-5-5"
codex_alternative = "gpt-6-sol"

[subagents]
# 子代理请求费用占会话费用的比例和请求次数都达到时才提示
min_cost_share = 0.3
min_requests = 10

[model_switch]
ignore_models = ["haiku"]

[context_spike]
# 30 天实测热缓存中途写入最大：Claude 48219、Codex 22069；2 万命中 11 次。
min_spike_tokens = 20000
target_tokens = 10000

[runaway_prompt]
max_requests_per_prompt = 40
# 30 天实测 Codex 每提示 p95 为 88.5 次，向上取整；Claude p95 为 33 次，采用 40 次下限。
codex_max_requests_per_prompt = 89

[expensive_subagent]
min_requests = 5
claude_alternative = "claude-sonnet-5-5"
codex_alternative = "gpt-6-sol"

[heavy_reasoning]
min_reasoning_tokens = 2000
min_reasoning_share = 0.8
keep_share = 0.3

[fast_mode]
# Anthropic 官方定价：Opus 5.5 快速模式 $8/$40 对标准 $4/$20，Opus 5 / 4.8 为 $10/$50 对 $5/$25。
claude_price_multiplier = 2
claude_models = ["claude-opus-5-5", "claude-opus-5", "claude-opus-4-8"]

[high_effort_light_task]
claude_high_efforts = ["xhigh", "max"]
codex_high_efforts = ["xhigh"]

[frequent_compaction]
min_compactions = 2

[web_search]
min_searches = 20

[session_startup]
bytes_per_token = 3

[quota_rebalance]
busy_weekly_pct = 70
idle_weekly_pct = 30

[plan_fit]
headroom = 0.7
min_weeks = 4
min_capped_weeks = 2
max_end_gap_hours = 24

[plan_fit.claude_capacity]
pro = 1
max_5x = 5
max_20x = 20

[plan_fit.chatgpt_capacity]
plus = 1
# pro 容量未知，暂不填写。

[alerts]
# 后台提醒：两条系统通知之间至少间隔这么多分钟，期间新出现的问题只记下不通知
cooldown_minutes = 5
# 轻量任务要等这次提示结束才能判断：同一会话出现下一条提示，或安静这么多分钟
light_task_settle_minutes = 3
# 只看最近这么多小时内的请求
lookback_hours = 6

# 每条建议的「下一步」和可复制命令写在 crates/core/src/advice/next_step.rs，不放在这里：
# 只有在对应工具上核实过的命令才给复制按钮，覆盖文件不能添加未核实的命令。

