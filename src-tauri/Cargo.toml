[package]
name = "token-audit-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "token-audit-desktop"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
token_audit_core = { path = "../crates/core" }
dirs = "7.0.0"
sys-locale = "0.3.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
notify = "8.2.1"
tauri-plugin-notification = "2.7.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = "=2.13.3"
tauri-plugin-dialog = "=2.8.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-core-foundation", "NSAttributedString", "NSBitmapImageRep", "NSColor", "NSFont", "NSFontDescriptor", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSStringDrawing"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNNotificationSound", "UNNotification", "UNNotificationResponse"] }
block2 = "0.6.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService"] }

[build-dependencies]
serde_json = "1.0.149"
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
