# 发布桌面安装包和应用内更新。产物未做系统代码签名、未公证：
# macOS 首次打开需在 Finder 中右键应用并选择「打开」，或在「系统设置 → 隐私与安全性」里允许；
# Windows SmartScreen 需选择「仍要运行」。
#
# 应用内更新（M13）：推送 v* 标签后，先建草稿 Release，三个平台并行打包并上传安装包、
# 更新包、签名和合并后的 latest.json，最后检查 latest.json 是否四个平台都齐。人工检查草稿
# 再发布，releases/latest 才会指向新版本。更新说明写在附注标签里：
#   git tag -a v0.2.0 -m "更新说明"
# 需要仓库 secrets：TAURI_SIGNING_PRIVATE_KEY、TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
# 手动触发（workflow_dispatch）只打包并上传为 workflow artifact，不建 Release。

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check version matches tag
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致" >&2
            exit 1
          fi

      # actions/checkout 拿到的是轻量引用，重新取一次才有附注标签的正文。
      - name: Read release notes from the tag
        id: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 直接从创建接口的响应取 id：刚建好的草稿不会马上出现在 Release 列表里。
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="token-audit ${GITHUB_REF_NAME#v}" \
            -f body="$NOTES" -F draft=true --jq .id)
          if [ -z "$id" ]; then
            echo "没有拿到草稿 Release 的 id" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.target }}
    needs: create-release
    # 手动触发时 create-release 被跳过，打包仍然进行。
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            bundles: app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            rust_targets: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
            rust_targets: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain 用工具链通道作版本号，没有独立的 semver 标签。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build-sidecar.ps1 -Target ${{ matrix.target }}

      # 有 releaseId 时上传到草稿 Release 并合并 latest.json；没有时只打包。
      - name: Bundle
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.release_id && github.ref_name || '' }}
          releaseDraft: true
          releaseBody: ${{ needs.create-release.outputs.notes }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          uploadWorkflowArtifacts: true
          # macOS 同时出 .app 和 .dmg，名字要带 [bundle] 才不会重名。
          workflowArtifactNamePattern: token-audit-${{ matrix.target }}-[bundle]

  # 三个任务各自合并 latest.json，同时完成时可能互相覆盖；缺平台就失败，重跑缺的任务即可。
  check-updater-json:
    needs: [create-release, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check latest.json covers every platform
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "草稿 Release 里没有 latest.json" >&2
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 windows-aarch64; do
            if ! jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' latest.json > /dev/null; then
              echo "latest.json 缺少 $platform" >&2
              exit 1
            fi
          done
          # requireSignedVersion 会拒绝版本与签名不一致的更新，这里提前拦住。
          if [ "$(jq -r .version latest.json)" != "${GITHUB_REF_NAME#v}" ]; then
            echo "latest.json 的版本 $(jq -r .version latest.json) 与标签 $GITHUB_REF_NAME 不一致" >&2
            exit 1
          fi
          jq '{version, platforms: (.platforms | keys)}' latest.json
