# 发布桌面安装包和应用内更新。产物未做系统代码签名、未公证：
# macOS 首次打开需在 Finder 中右键应用并选择「打开」，或在「系统设置 → 隐私与安全性」里允许；
# Windows SmartScreen 需选择「仍要运行」。
#
# 应用内更新（M13）：推送 v* 标签后，先建草稿 Release，三个平台并行打包并上传安装包、
# 更新包和签名；最后由单个任务生成并检查 latest.json。人工检查草稿
# 再发布，releases/latest 才会指向新版本。更新说明写在附注标签里：
#   git tag -a v0.2.0 -m "更新说明"
# 需要仓库 secrets：TAURI_SIGNING_PRIVATE_KEY、TAURI_SIGNING_PRIVATE_KEY_PASSWORD。
# 手动触发（workflow_dispatch）只打包并上传为 workflow artifact，不建 Release。

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Check version matches tag
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与 tauri.conf.json 的版本 $version 不一致" >&2
            exit 1
          fi

      # actions/checkout 拿到的是轻量引用，重新取一次才有附注标签的正文。
      - name: Read release notes from the tag
        id: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=$(git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)')
          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # 直接从创建接口的响应取 id：刚建好的草稿不会马上出现在 Release 列表里。
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="Tokmira ${GITHUB_REF_NAME#v}" \
            -f body="$NOTES" -F draft=true --jq .id)
          if [ -z "$id" ]; then
            echo "没有拿到草稿 Release 的 id" >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.target }}
    needs: create-release
    # 手动触发时 create-release 被跳过，打包仍然进行。
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            asset_name: macos-universal
            bundles: app,dmg
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: windows-amd64
            bundles: nsis
            rust_targets: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset_name: windows-arm64
            bundles: nsis
            rust_targets: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: 12.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22
          cache: pnpm

      # dtolnay/rust-toolchain 用工具链通道作版本号，没有独立的 semver 标签。
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build sidecar (macOS)
        if: runner.os == 'macOS'
        run: sh scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build-sidecar.ps1 -Target ${{ matrix.target }}

      # 有 releaseId 时上传到草稿 Release；没有时只打包。
      - name: Bundle
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.release_id && github.ref_name || '' }}
          releaseDraft: true
          releaseBody: ${{ needs.create-release.outputs.notes }}
          # 例如 tokmira-1.3.0-windows-amd64-setup.exe、tokmira-1.3.0-macos-universal.dmg。
          releaseAssetNamePattern: tokmira-[version]-${{ matrix.asset_name }}[setup][ext]
          uploadUpdaterJson: false
          retryAttempts: 2
          uploadWorkflowArtifacts: true
          # macOS 同时出 .app 和 .dmg，名字要带 [bundle] 才不会重名。
          workflowArtifactNamePattern: tokmira-${{ matrix.target }}-[bundle]

  # Wait for every bundle before building one manifest from the draft's uploaded assets.
  check-updater-json:
    needs: [create-release, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Draft Release assets require contents: write access.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Generate and check latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" > assets.json
          mkdir signatures
          jq -r '.[] | select(.name | endswith(".sig")) | [.id, .name] | @tsv' assets.json |
            while IFS="$(printf '\t')" read -r asset_id asset_name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "signatures/$asset_name"
            done
          node tool/updater_manifest.mjs release.json assets.json signatures latest.json

      - name: Replace draft manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          jq -r '.[] | select(.name == "latest.json") | .id' assets.json |
            while read -r asset_id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY"
