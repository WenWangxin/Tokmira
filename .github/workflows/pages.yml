name: pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'tool/build_site.mjs'
      - 'tool/check_site.mjs'
      - 'snapshots/**'
      - '.github/workflows/pages.yml'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'WenWangxin/token-audit'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 22

      - name: Build website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_REQUIRE_RELEASES: '1'
        run: node tool/build_site.mjs _site

      - name: Check website routes and sitemap
        run: node tool/check_site.mjs _site

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
